[2.2.0]
Added tooltip for unit names
Fixed alignment of copy buttons

[2.5.0]
Cards auto-scroll into view when the keyboard opens
Numbers too long to fit the box now switch to scientific notation
Improved conversion precision by tracking the full value instead of the rounded display text
Settings category picker now matches the main screen's style and formatting

[2.6.0]
Settings now show each unit's full name alongside its abbreviation
Added millimeters of water (mmH2O) to the Pressure category

[2.6.1]
Corrected mmH2O to use the standard 4°C water density; water/mercury units now show their reference temperature
Improved number formatting so values fit as plain numbers more often before switching to scientific notation
The app now reopens to whichever unit category you were last using instead of always starting on Length
